name: Cadena Invisible CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm check
      - name: Tests
        run: pnpm test -- --runInBand
      - name: Build
        run: pnpm build
      - name: Portability contract
        run: node --check scripts/verify-portability.mjs && node --check scripts/audit-database.mjs && node --check scripts/backfill-project.mjs
      - name: Diff hygiene
        run: git diff --check
