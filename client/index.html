<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#203b36" />
    <title>Cadena Invisible — Painel de Ressonância</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
    <style>
      footer-watermark,
      .footer-watermark-root {
        display: none !important;
      }
    </style>
    <script>
      (() => {
        const hostRule = "footer-watermark { display: none !important; visibility: hidden !important; }";
        const innerRule = ".footer-watermark-root { display: none !important; visibility: hidden !important; }";

        const ensureStyle = (scope, key, css) => {
          if (!scope || scope.querySelector(`style[data-cadena-wm="${key}"]`)) return;
          const style = document.createElement("style");
          style.dataset.cadenaWm = key;
          style.textContent = css;
          scope.appendChild(style);
        };

        const applyWatermarkProtection = () => {
          const host = document.querySelector("manus-content-root");
          const hostShadowRoot = host && host.shadowRoot;
          if (!hostShadowRoot) return false;

          ensureStyle(hostShadowRoot, "host", hostRule);

          const watermark = hostShadowRoot.querySelector("footer-watermark");
          const watermarkShadowRoot = watermark && watermark.shadowRoot;
          if (!watermarkShadowRoot) return false;

          ensureStyle(watermarkShadowRoot, "inner", innerRule);
          return true;
        };

        applyWatermarkProtection();
        let attempts = 0;
        const retry = window.setInterval(() => {
          if (applyWatermarkProtection() || ++attempts >= 20) window.clearInterval(retry);
        }, 250);

        new MutationObserver(applyWatermarkProtection).observe(document.documentElement, {
          childList: true,
          subtree: true,
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/javascript" src="/api/platform/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
